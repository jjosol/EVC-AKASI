<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Common Illnesses/Injuries</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            max-width: 21cm;
            margin: 0 auto;
            background: white;
            position: relative;
            color: #333;
            line-height: 1.4;
            padding: 2cm;
        }
        
        h2 {
            font-size: 14px;
            margin-bottom: 15px;
            color: #003366;
            text-align: center;
            font-weight: bold;
        }
        
        .date {
            text-align: center;
            margin-bottom: 30px;
            font-size: 12px;
            color: #003366;
            font-weight: bold;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            font-size: 11px;
        }
        
        th {
            background-color: #f0f5fa;
            color: #003366;
            font-weight: bold;
        }
        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        tr:hover {
            background-color: #f0f7ff;
        }
        
        .category-row {
            background-color: #eef4fa;
            font-weight: bold;
            color: #003366;
        }
        
        .blue {
            color: #0066cc;
        }
        
        @page {
            size: A4;
            margin: 0;
        }
        
        @media print {
            body {
                padding: 2cm;
            }
            
            table {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h2>LIST OF COMMON ILLNESSES/INJURIES</h2>
        <div class="date">JULY 2022</div>
        
        <table>
            <tr class="category-row">
                <td colspan="3">Students – Extern = 8</td>
            </tr>
            <tr>
                <th>Gender</th>
                <th>Illnesses/Injuries</th>
                <th>Intervention</th>
            </tr>
            <tr>
                <td>Male = 1</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Female = 1</td>
                <td></td>
                <td></td>
            </tr>
            <tr class="category-row">
                <td colspan="3">Students – Dormer = 8</td>
            </tr>
            <tr>
                <th>Gender</th>
                <th>Illnesses/Injuries</th>
                <th>Intervention</th>
            </tr>
            <tr>
                <td>Male = 1</td>
                <td>Male = 1</td>
                <td>Male = 1</td>
            </tr>
            <tr>
                <td>Female = 1</td>
                <td>Female = 1</td>
                <td>Female = 1</td>
            </tr>
        </table>
    </div>
</body>
</html>
